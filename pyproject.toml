[build-system]
requires = ["hatchling>=1.29,<2"]
build-backend = "hatchling.build"

[project]
name = "copysnipin"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136,<0.137",
    "uvicorn[standard]>=0.45,<0.46",
    "textual>=8.2,<9",
    "pydantic-settings>=2.14,<3",
]

[project.scripts]
copysnipin-api-smoke = "copysnipin.main:main"
copysnipin-scanner = "copysnipin.scanner:main"
copysnipin-tracker = "copysnipin.tracker:main"
copysnipin-simulator = "copysnipin.simulator:main"
copysnipin-pyth-feed = "copysnipin.pyth_feed:main"
copysnipin-dashboard = "copysnipin.dashboard:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "mypy>=1.20,<2",
    "ruff>=0.15,<0.16",
    "httpx>=0.28,<0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/copysnipin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
packages = ["copysnipin"]
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_defs = true