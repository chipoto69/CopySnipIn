      PIDFILE=".factory/run/tracker.pid" &&
      test -f "$PIDFILE" && PID="$(cat "$PIDFILE")" &&
      kill -0 "$PID" 2>/dev/null
    port: 0
    depends_on: [postgres, redis, api]

  simulator:
