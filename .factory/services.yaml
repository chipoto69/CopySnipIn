commands:
  install: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv sync --locked
  typecheck: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run mypy src/
  build: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv build
  test: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run pytest tests/ -x -q
  lint: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run ruff check . && uv run ruff format --check .
  lint-fix: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run ruff check --fix . && uv run ruff format .

services:
  postgres:
    start: echo "Postgres already running on 5432"
    stop: echo "Do not stop shared Postgres"
    healthcheck: pg_isready -h localhost -p 5432
    port: 5432
    depends_on: []

  redis:
    start: echo "Redis already running on 6379"
    stop: echo "Do not stop shared Redis"
    healthcheck: redis-cli ping
    port: 6379
    depends_on: []

  api:
    start: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && DATABASE_URL=postgresql://localhost:5432/copysnipin REDIS_URL=redis://localhost:6379/0 uv run uvicorn copysnipin.main:app --host 0.0.0.0 --port 8090
    stop: pkill -f "uvicorn copysnipin.main:app" || true
    healthcheck: curl -sf http://localhost:8090/health
    port: 8090
    depends_on: [postgres, redis]

  scanner:
    start: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && DATABASE_URL=postgresql://localhost:5432/copysnipin REDIS_URL=redis://localhost:6379/0 uv run python -m copysnipin.scanner
    stop: pkill -f "copysnipin.scanner" || true
    healthcheck: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run python -m copysnipin.scanner >/dev/null
    port: 0
    depends_on: [postgres, redis, api]

  tracker:
    start: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && DATABASE_URL=postgresql://localhost:5432/copysnipin REDIS_URL=redis://localhost:6379/0 uv run python -m copysnipin.tracker
    stop: pkill -f "copysnipin.tracker" || true
    healthcheck: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run python -m copysnipin.tracker >/dev/null
    port: 0
    depends_on: [postgres, redis, api]

  simulator:
    start: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && DATABASE_URL=postgresql://localhost:5432/copysnipin REDIS_URL=redis://localhost:6379/0 uv run python -m copysnipin.simulator
    stop: pkill -f "copysnipin.simulator" || true
    healthcheck: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run python -m copysnipin.simulator >/dev/null
    port: 0
    depends_on: [postgres, redis, api]

  pyth_feed:
    start: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && DATABASE_URL=postgresql://localhost:5432/copysnipin REDIS_URL=redis://localhost:6379/0 uv run python -m copysnipin.pyth_feed
    stop: pkill -f "copysnipin.pyth_feed" || true
    healthcheck: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run python -m copysnipin.pyth_feed >/dev/null
    port: 0
    depends_on: [postgres, redis, api]

  dashboard:
    start: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && DATABASE_URL=postgresql://localhost:5432/copysnipin REDIS_URL=redis://localhost:6379/0 uv run python -m copysnipin.dashboard
    stop: pkill -f "copysnipin.dashboard" || true
    healthcheck: ROOT="$(git rev-parse --show-toplevel)" && cd "$ROOT" && uv run python -m copysnipin.dashboard >/dev/null
    port: 0
    depends_on: [api]
